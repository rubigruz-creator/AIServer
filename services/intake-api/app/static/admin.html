<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявки и диалоги — AIServer</title>
  <style>
    :root {
      --bg: #f4f6f5;
      --card: #fff;
      --border: #dde5e0;
      --primary: #1a6b4a;
      --danger: #b42318;
      --danger-bg: #fdecea;
      --text: #1a1a1a;
      --muted: #5c6b63;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--primary);
      color: #fff;
      padding: 16px 24px;
    }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 6px 0 0; opacity: 0.9; font-size: 14px; }
    main { padding: 20px 24px 40px; max-width: 1400px; margin: 0 auto; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }
    .toolbar label { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .toolbar select {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }
    th {
      background: #eef3f0;
      font-weight: 600;
      user-select: none;
    }
    th.sortable { cursor: pointer; }
    th.sortable:hover { background: #e2ebe6; }
    th.sortable.active { color: var(--primary); }
    th .sort-arrow { font-size: 10px; margin-left: 4px; opacity: 0.7; }
    tr.data-row:hover { background: #f9fbfa; cursor: pointer; }
    tr.data-row.selected { background: #e8f5ee; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-yes { background: #d4edda; color: #155724; }
    .badge-no { background: #f0f0f0; color: #666; }
    .detail {
      margin-top: 20px;
      background: var(--card);
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      display: none;
    }
    .detail.open { display: block; }
    .detail-header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .detail-header h2 { margin: 0; font-size: 18px; }
    .msg {
      margin: 8px 0;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .msg.user { background: #e8f5ee; }
    .msg.assistant { background: #fff; border: 1px solid var(--border); }
    .msg.system { background: #f0f4f2; color: var(--muted); font-size: 13px; }
    .meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .empty { padding: 24px; text-align: center; color: var(--muted); }
    .btn {
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.2;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { opacity: 0.92; }
    .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid #f5c2c0; }
    .btn-danger:hover { background: #fad4d2; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .actions { white-space: nowrap; }
    .source-cell { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <header>
    <h1>Диалоги и заявки виджета</h1>
    <p>Полная история чатов · автоудаление при старте: диалоги с &lt; 3 сообщений (INTAKE_AUTO_PURGE_MIN_MESSAGES)</p>
  </header>
  <main>
    <div class="toolbar">
      <label>
        <input type="checkbox" id="applicationsOnly">
        Только с заявкой
      </label>
      <label>
        Сортировка
        <select id="sortBy">
          <option value="created_at">Дата создания</option>
          <option value="updated_at">Дата обновления</option>
          <option value="message_count">Число сообщений</option>
          <option value="has_application">Есть заявка</option>
          <option value="client_phone">Телефон</option>
          <option value="vehicle">Авто</option>
          <option value="service_type">Услуга</option>
          <option value="source_url">Источник (сайт)</option>
        </select>
      </label>
      <label>
        Порядок
        <select id="sortOrder">
          <option value="desc">По убыванию</option>
          <option value="asc">По возрастанию</option>
        </select>
      </label>
      <button type="button" class="btn btn-primary" id="refreshBtn">Обновить</button>
      <button type="button" class="btn btn-danger" id="purgeShortBtn" title="Удалить все диалоги с менее чем 3 сообщениями">
        Удалить короткие (&lt;3)
      </button>
      <span id="stats" class="meta"></span>
    </div>
    <table>
      <thead>
        <tr id="headerRow">
          <th class="sortable" data-sort="created_at">Создан<span class="sort-arrow"></span></th>
          <th class="sortable" data-sort="updated_at">Обновлён<span class="sort-arrow"></span></th>
          <th class="sortable" data-sort="has_application">Заявка<span class="sort-arrow"></span></th>
          <th class="sortable" data-sort="client_phone">Телефон<span class="sort-arrow"></span></th>
          <th class="sortable" data-sort="vehicle">Авто<span class="sort-arrow"></span></th>
          <th class="sortable" data-sort="service_type">Услуга<span class="sort-arrow"></span></th>
          <th class="sortable" data-sort="message_count">Сообщ.<span class="sort-arrow"></span></th>
          <th class="sortable" data-sort="source_url">Источник<span class="sort-arrow"></span></th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">Пока нет диалогов</div>
    <section id="detail" class="detail">
      <div class="detail-header">
        <h2>Диалог</h2>
        <button type="button" class="btn btn-danger" id="deleteDetailBtn">Удалить диалог</button>
      </div>
      <div id="detailMeta" class="meta"></div>
      <div id="detailMessages"></div>
    </section>
  </main>
  <script>
    const rowsEl = document.getElementById('rows');
    const detailEl = document.getElementById('detail');
    const detailMeta = document.getElementById('detailMeta');
    const detailMessages = document.getElementById('detailMessages');
    const statsEl = document.getElementById('stats');
    const emptyEl = document.getElementById('empty');
    const sortByEl = document.getElementById('sortBy');
    const sortOrderEl = document.getElementById('sortOrder');

    let selectedId = null;

    function fmt(iso) {
      if (!iso) return '—';
      try {
        return new Date(iso).toLocaleString('ru-RU', { timeZone: 'Europe/Moscow' });
      } catch (e) {
        return iso;
      }
    }

    function escapeHtml(s) {
      if (!s) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function updateSortHeaders() {
      const by = sortByEl.value;
      const order = sortOrderEl.value;
      document.querySelectorAll('th.sortable').forEach(function (th) {
        const field = th.getAttribute('data-sort');
        th.classList.toggle('active', field === by);
        const arrow = th.querySelector('.sort-arrow');
        if (arrow) {
          arrow.textContent = field === by ? (order === 'asc' ? '▲' : '▼') : '';
        }
      });
    }

    async function deleteConversation(id, confirmMsg) {
      if (!confirm(confirmMsg || 'Удалить этот диалог безвозвратно?')) {
        return false;
      }
      const res = await fetch(
        '/intake/api/admin/conversations/' + encodeURIComponent(id),
        { method: 'DELETE', credentials: 'same-origin' }
      );
      if (!res.ok) {
        alert('Ошибка удаления: ' + res.status);
        return false;
      }
      if (selectedId === id) {
        selectedId = null;
        detailEl.classList.remove('open');
      }
      return true;
    }

    async function loadList() {
      const only = document.getElementById('applicationsOnly').checked;
      const sortBy = sortByEl.value;
      const sortOrder = sortOrderEl.value;
      const params = new URLSearchParams({
        limit: '200',
        sort_by: sortBy,
        sort_order: sortOrder,
      });
      if (only) params.set('applications_only', 'true');

      const res = await fetch('/intake/api/admin/conversations?' + params, {
        credentials: 'same-origin',
      });
      if (!res.ok) {
        alert('Ошибка загрузки: ' + res.status);
        return;
      }
      const data = await res.json();
      updateSortHeaders();
      statsEl.textContent = 'Показано: ' + data.items.length + ' из ' + data.total;
      rowsEl.innerHTML = '';
      if (!data.items.length) {
        emptyEl.style.display = 'block';
        if (!selectedId) detailEl.classList.remove('open');
        return;
      }
      emptyEl.style.display = 'none';
      data.items.forEach(function (item) {
        const tr = document.createElement('tr');
        tr.className = 'data-row' + (item.id === selectedId ? ' selected' : '');
        const source = item.source_url || '—';
        tr.innerHTML =
          '<td>' + fmt(item.created_at) + '</td>' +
          '<td>' + fmt(item.updated_at) + '</td>' +
          '<td><span class="badge ' + (item.has_application ? 'badge-yes' : 'badge-no') + '">' +
          (item.has_application ? 'да' : 'нет') + '</span></td>' +
          '<td>' + escapeHtml(item.client_phone || '—') + '</td>' +
          '<td>' + escapeHtml(item.vehicle || '—') + '</td>' +
          '<td>' + escapeHtml(item.service_type || '—') + '</td>' +
          '<td>' + (item.message_count || 0) + '</td>' +
          '<td class="source-cell" title="' + escapeHtml(source) + '">' + escapeHtml(source) + '</td>' +
          '<td class="actions"><button type="button" class="btn btn-danger btn-sm btn-delete" data-id="' +
          escapeHtml(item.id) + '">Удалить</button></td>';
        tr.addEventListener('click', function (e) {
          if (e.target.closest('.btn-delete')) return;
          loadDetail(item.id);
        });
        const delBtn = tr.querySelector('.btn-delete');
        delBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          deleteConversation(item.id).then(function (ok) {
            if (ok) loadList();
          });
        });
        rowsEl.appendChild(tr);
      });
    }

    async function loadDetail(id) {
      selectedId = id;
      document.querySelectorAll('tr.data-row').forEach(function (tr) {
        const btn = tr.querySelector('.btn-delete');
        tr.classList.toggle('selected', btn && btn.getAttribute('data-id') === id);
      });
      const res = await fetch('/intake/api/admin/conversations/' + encodeURIComponent(id), {
        credentials: 'same-origin',
      });
      if (!res.ok) {
        alert('Ошибка: ' + res.status);
        return;
      }
      const data = await res.json();
      const c = data.conversation;
      detailMeta.innerHTML =
        '<div><strong>ID:</strong> <code>' + escapeHtml(c.id) + '</code></div>' +
        '<div>Создан: ' + fmt(c.created_at) + ' · Обновлён: ' + fmt(c.updated_at) + '</div>' +
        (c.source_url ? '<div>Источник: ' + escapeHtml(c.source_url) + '</div>' : '') +
        (c.application_line ? '<div><strong>Заявка:</strong> ' + escapeHtml(c.application_line) + '</div>' : '');
      detailMessages.innerHTML = '';
      data.messages.forEach(function (m) {
        const div = document.createElement('div');
        div.className = 'msg ' + m.role;
        div.textContent =
          (m.role === 'user' ? 'Клиент: ' : m.role === 'assistant' ? 'Бот: ' : 'Система: ') +
          m.content;
        detailMessages.appendChild(div);
      });
      detailEl.classList.add('open');
    }

    document.getElementById('refreshBtn').addEventListener('click', loadList);
    document.getElementById('applicationsOnly').addEventListener('change', loadList);
    sortByEl.addEventListener('change', loadList);
    sortOrderEl.addEventListener('change', loadList);

    document.querySelectorAll('th.sortable').forEach(function (th) {
      th.addEventListener('click', function () {
        const field = th.getAttribute('data-sort');
        if (sortByEl.value === field) {
          sortOrderEl.value = sortOrderEl.value === 'desc' ? 'asc' : 'desc';
        } else {
          sortByEl.value = field;
          sortOrderEl.value = field === 'created_at' || field === 'updated_at' ? 'desc' : 'asc';
        }
        loadList();
      });
    });

    document.getElementById('purgeShortBtn').addEventListener('click', async function () {
      if (!confirm('Удалить все диалоги, в которых меньше 3 сообщений?')) return;
      const res = await fetch('/intake/api/admin/purge-short?min_messages=3', {
        method: 'POST',
        credentials: 'same-origin',
      });
      if (!res.ok) {
        alert('Ошибка: ' + res.status);
        return;
      }
      const data = await res.json();
      alert('Удалено диалогов: ' + data.deleted_count);
      selectedId = null;
      detailEl.classList.remove('open');
      loadList();
    });

    document.getElementById('deleteDetailBtn').addEventListener('click', function () {
      if (!selectedId) return;
      deleteConversation(selectedId).then(function (ok) {
        if (ok) loadList();
      });
    });

    loadList();
  </script>
</body>
</html>
